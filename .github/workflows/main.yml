name: Verify Cosmo Browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Download and verify pinned source baseline
        run: node tools/python.cjs tools/fetch-upstream.py
      - run: npm run test:upstream
      - run: npm run extensions:pack
      - name: Install test Chromium
        if: runner.os == 'Linux'
        run: npm exec playwright install --with-deps chromium
      - name: Test real desktop extension
        if: runner.os == 'Linux'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: cosmo-development-extensions
          path: |
            dist/extensions/
            test-results/*.png
          retention-days: 14
