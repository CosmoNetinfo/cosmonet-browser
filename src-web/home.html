<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoNet Home</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #262626; /* Antracite */
            color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background-image: linear-gradient(rgba(38, 38, 38, 0.7), rgba(38, 38, 38, 0.7)), url('assets/alieno mascotte.jpg');
            background-size: cover;
            background-position: center;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #3b82f6, #9333ea);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
        }

        .link-card {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            transform: translateY(-5px);
        }

        .link-card img {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
        }

        .link-card span {
            display: block;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        /* Effetti particellari di sfondo sono gestiti dal CSS background-image cover */
    </style>
</head>
<body>
    <div class="container">
        <h1>CosmoNet</h1>
        <p>Benvenuto nel tuo spazio personale</p>
        
        <div class="search-box">
            <input type="text" placeholder="Cerca su Google o inserisci URL..." id="search-input">
        </div>

        <div class="quick-links">
            <div class="link-card" onclick="navigate('https://www.google.it')">
                <span>Google</span>
            </div>
            <div class="link-card" onclick="navigate('https://www.cosmonet.info')">
                <span>CosmoNet</span>
            </div>
            <div class="link-card" onclick="navigate('https://www.youtube.com')">
                <span>YouTube</span>
            </div>
            <div class="link-card" onclick="navigate('https://chat.openai.com')">
                <span>ChatGPT</span>
            </div>
        </div>
    <style>
        .news-section { display: none; } /* Fallback se rimanesse qualcosa */
    </style>
    <script>
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch(e.target.value);
        });

        function handleSearch(query) {
            query = query.trim();
            if (!query) return;
            
            let url = query;
            if (!url.match(/^https?:\/\//)) {
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                }
            }
            window.location.href = url; // Naviga nell'iframe corrente
        }

        function navigate(url) {
            window.location.href = url;
            // Se volessimo aprire in nuova tab, useremmo: window.parent.createNewTab(url)
        }
    </script>
</body>
</html>
