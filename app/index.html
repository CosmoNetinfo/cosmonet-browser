<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cosmo Browser</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="browser.css"><script type="module" src="browser.mjs"></script></head>
<body>
<header id="chrome"><div id="tabs" role="tablist" aria-label="Schede"></div><button id="new-tab" title="Nuova scheda (Ctrl+T)" aria-label="Nuova scheda">+</button>
<nav aria-label="Navigazione"><button id="back" title="Indietro" aria-label="Indietro">←</button><button id="forward" title="Avanti" aria-label="Avanti">→</button><button id="reload" title="Ricarica" aria-label="Ricarica">↻</button><button id="home" title="Pagina iniziale" aria-label="Pagina iniziale"><img src="logo.png" width="24" height="24" alt=""></button><form id="address-form"><label for="address" class="sr-only">Indirizzo o ricerca</label><input id="address" placeholder="Cerca o inserisci un indirizzo" autocomplete="off" spellcheck="false"></form><button id="bookmark" title="Aggiungi ai preferiti" aria-label="Aggiungi ai preferiti">☆</button><button id="menu" title="Strumenti CosmoNet" aria-label="Strumenti CosmoNet">☰</button></nav>
<div id="progress" aria-hidden="true"></div></header>
<main id="content" aria-label="Contenuto della scheda"></main>
<footer><span id="status" role="status">Avvio di Cosmo Browser…</span><span id="security"></span></footer>
<dialog id="tools"><div class="heading"><h2>Cosmo Browser</h2><button data-close="tools" aria-label="Chiudi strumenti">×</button></div><p class="subtle">Il tuo browser, sul tuo dispositivo.</p><div class="tool-grid"><button id="show-bookmarks">Preferiti</button><button id="show-history">Cronologia</button><button id="show-vault">Password locali</button><button id="reader">Lettura CosmoNet</button><button id="devtools">Strumenti sviluppatore</button><button id="console">Console Eruda</button></div><label for="theme">Tema</label><select id="theme"><option value="system">Come il sistema</option><option value="light">Chiaro</option><option value="dark">Scuro</option><option value="sand">Sabbia</option></select><p class="subtle">Credenziali cifrate sul dispositivo. Nessuna sincronizzazione account.</p></dialog>
<dialog id="list"><div class="heading"><h2 id="list-title">Preferiti</h2><button data-close="list" aria-label="Chiudi elenco">×</button></div><div id="list-items"></div><button id="clear-history" hidden>Svuota cronologia</button></dialog>
<dialog id="vault"><div class="heading"><h2>Password locali</h2><button data-close="vault" aria-label="Chiudi password">×</button></div><p class="subtle">Salva un accesso per il sito HTTPS della scheda attiva. La compilazione richiede un tuo clic.</p><div id="vault-items"></div><form id="vault-form"><label for="vault-user">Nome utente o email</label><input id="vault-user" autocomplete="off" maxlength="512" required><label for="vault-secret">Password</label><input id="vault-secret" type="password" autocomplete="new-password" maxlength="4096" required><button type="submit">Salva sul dispositivo</button></form><p id="vault-status" role="status"></p></dialog>
</body></html>
