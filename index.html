<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmonet Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header con logo e navigazione -->
    <div class="header">
      <div class="logo-section">
        <div class="logo">
          <img
            src="assets/logo.png"
            alt="Cosmonet Logo"
            width="40"
            height="40"
          />
        </div>
        <span class="brand-name">Cosmonet Browser</span>
      </div>

      <div class="nav-controls">
        <button id="back-btn" class="nav-btn" title="Indietro" disabled>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>
        <button id="forward-btn" class="nav-btn" title="Avanti" disabled>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
        <button id="reload-btn" class="nav-btn" title="Ricarica">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"
            />
          </svg>
        </button>
        <button id="home-btn" class="nav-btn" title="Home">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </button>
      </div>

      <div class="url-bar-container">
        <input
          type="text"
          id="url-bar"
          placeholder="Cerca o inserisci un indirizzo web..."
        />
        <button
          id="bookmark-btn"
          class="bookmark-btn"
          title="Aggiungi ai segnalibri"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>
      </div>

      <div class="toolbar-controls">
        <button id="bookmarks-btn" class="toolbar-btn" title="Segnalibri">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>
        <button id="history-btn" class="toolbar-btn" title="Cronologia">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </button>
        <button id="new-tab-btn" class="toolbar-btn" title="Nuova Tab">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <button id="settings-btn" class="toolbar-btn" title="Impostazioni">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
      <div id="tabs-bar" class="tabs-bar"></div>
    </div>

    <!-- Pannello segnalibri -->
    <div id="bookmarks-panel" class="side-panel">
      <div class="panel-header">
        <h3>Segnalibri</h3>
        <button class="close-panel-btn">×</button>
      </div>
      <div id="bookmarks-list" class="panel-content"></div>
    </div>

    <!-- Pannello cronologia -->
    <div id="history-panel" class="side-panel">
      <div class="panel-header">
        <h3>Cronologia</h3>
        <button class="close-panel-btn">×</button>
        <button id="clear-history-btn" class="clear-btn">Cancella tutto</button>
      </div>
      <div id="history-list" class="panel-content"></div>
    </div>

    <!-- Pannello Impostazioni -->
    <div id="settings-panel" class="side-panel">
      <div class="panel-header">
        <h3>Impostazioni</h3>
        <button class="close-panel-btn">×</button>
      </div>
      <div class="panel-content">
        <div class="settings-group">
          <label>Pagina Iniziale (Homepage)</label>
          <input type="text" id="setting-home-url" placeholder="https://..." />
        </div>

        <div class="settings-group">
          <label>Motore di Ricerca</label>
          <select id="setting-search-engine" title="Motore di ricerca predefinito">
            <option value="https://www.google.com/search?q=">Google</option>
            <option value="https://www.bing.com/search?q=">Bing</option>
            <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          </select>
        </div>

        <div class="settings-group">
          <label class="checkbox-label">
            <input type="checkbox" id="setting-dark-mode" />
            Modalità Scura (Interfaccia)
          </label>
        </div>

        <div class="settings-divider"></div>

        <div class="settings-group">
          <button id="save-settings-btn" class="save-btn">
            Salva Impostazioni
          </button>
        </div>
      </div>
    </div>

    <!-- Container webviews -->
    <div id="webviews-container" class="webviews-container"></div>

    <script src="renderer.js"></script>
  </body>
</html>
