[package]
name = "cosmo-browser"
version = "0.3.2"
description = "Cosmo Browser: Tauri, Rust and native WebViews"
authors = ["CosmoNet"]
edition = "2021"
rust-version = "1.90"
repository = "https://github.com/CosmoNetinfo/cosmonet-browser"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["unstable", "devtools"] }
tauri-plugin-browser = { path = "plugins/browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
windows-core = "0.62"
webview2-com = "0.39"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "0.11"
semver = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
